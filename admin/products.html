<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Melghat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    body { background: #f5f0e8; }
    .table-wrap { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); overflow:hidden; }
    .cat-pill { cursor:pointer; }
    .cat-pill.active { background:#f4b400 !important; color:#3e2723 !important; }
  </style>
</head>
<body>
  <div class="row g-0 min-vh-100">
    <div class="col-md-2 admin-sidebar" id="adminSidebar"></div>
    <div class="col-md-10 p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h3 class="fw-bold mb-0">Products</h3>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" onclick="loadProducts()"><i class="fas fa-sync"></i></button>
          <button class="btn btn-warning fw-semibold" id="btnAdd" onclick="openProductModal()"><i class="fas fa-plus me-1"></i>Add Product</button>
        </div>
      </div>
      <div class="mb-3 d-flex flex-wrap gap-2" id="catFilters">
        <span class="badge bg-dark cat-pill active" data-cat="all" onclick="filterCat(this)">All</span>
      </div>
      <div class="table-wrap">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr><th>Image</th><th>Name</th><th>Category</th><th>Size</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="prodTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="prodModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header" style="background:#4e342e;color:#fff">
          <h5 class="modal-title" id="prodModalTitle">Add Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="prodId">
          <div class="row g-2">
            <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" id="pName"></div>
            <div class="col-md-6"><label class="form-label">Slug *</label><input class="form-control" id="pSlug" placeholder="forest-honey-100ml"></div>
            <div class="col-md-4"><label class="form-label">Category *</label>
              <select class="form-select" id="pCategory"></select>
            </div>
           <div class="col-md-4">
  <label class="form-label">Size *</label>
  <input type="text" class="form-control" id="pSize" 
         placeholder="e.g. 100ml, 250ml, 500g, 1kg, 2 liter" 
         list="sizeSuggestions">
  <datalist id="sizeSuggestions">
    <option value="50ml">
    <option value="100ml">
    <option value="200ml">
    <option value="250ml">
    <option value="500ml">
    <option value="750ml">
    <option value="1 liter">
    <option value="100g">
    <option value="250g">
    <option value="500g">
    <option value="1kg">
    <option value="2kg">
    <option value="5kg">
  </datalist>
  <small class="text-muted">Type any size: ml, liter, g, kg</small>
</div>
            <div class="col-md-4"><label class="form-label">Price (₹) *</label><input type="number" class="form-control" id="pPrice"></div>
            <div class="col-md-4"><label class="form-label">MRP</label><input type="number" class="form-control" id="pMrp"></div>
            <div class="col-md-4"><label class="form-label">Stock</label><input type="number" class="form-control" id="pStock" value="0"></div>
            <div class="col-md-4"><label class="form-label">SKU</label><input class="form-control" id="pSku"></div>
            <div class="col-12"><label class="form-label">Short Description</label><input class="form-control" id="pShort"></div>
            <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="pDesc" rows="2"></textarea></div>
            <div class="col-12">
              <label class="form-label">Product Image</label>
              <div class="d-flex gap-3 align-items-start flex-wrap">
                <div>
                  <img id="pImgPreview" src="" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:12px;background:#eee;display:none">
                </div>
                <div class="flex-grow-1">
                  <input type="file" class="form-control mb-2" id="pImgFile" accept="image/*">
                  <input type="text" class="form-control form-control-sm" id="pImg" placeholder="Or paste image URL">
                  <small class="text-muted" id="pImgStatus">Upload JPG/PNG or paste URL</small>
                </div>
              </div>
            </div>
            <div class="col-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="pActive" checked><label class="form-check-label">Active</label></div></div>
            <div class="col-6"><div class="form-check"><input class="form-check-input" type="checkbox" id="pFeatured"><label class="form-check-label">Featured</label></div></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-warning fw-semibold" onclick="saveProduct()">Save to Database</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-common.js"></script>
  <script src="../js/image-upload.js"></script>
  <script>
    let allProducts = [];
    let currentCat = "all";
    const session = requireStaff();
    if (session) {
      renderAdminSidebar("products");
      const sel = document.getElementById("pCategory");
      PRODUCT_CATEGORIES.forEach(c => { sel.innerHTML += `<option value="${c}">${c}</option>`; });
      const filters = document.getElementById("catFilters");
      PRODUCT_CATEGORIES.forEach(c => {
        filters.innerHTML += `<span class="badge bg-secondary cat-pill" data-cat="${c}" onclick="filterCat(this)">${c}</span>`;
      });
      if (session.role !== "admin") document.getElementById("btnAdd").style.display = "none";
      loadProducts();
    }

    async function loadProducts() {
      allProducts = await fetchProducts(false);
      renderTable();
    }

    function filterCat(el) {
      document.querySelectorAll(".cat-pill").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      currentCat = el.dataset.cat;
      renderTable();
    }

    function renderTable() {
      const rows = currentCat === "all" ? allProducts : allProducts.filter(p => (p.category || p.badge || "Everyday") === currentCat);
      const canEdit = isAdmin();
      document.getElementById("prodTable").innerHTML = rows.map(p => `
        <tr>
          <td><img src="${p.image_url||''}" width="42" height="42" style="object-fit:cover;border-radius:8px" onerror="this.src='https://via.placeholder.com/42'"></td>
          <td>${p.name}<br><small class="text-muted">${p.sku||''}</small></td>
          <td><span class="badge bg-warning text-dark">${p.category||p.badge||'Everyday'}</span></td>
          <td>${p.size}</td>
          <td>${formatPrice(p.price)}</td>
          <td>${p.stock}</td>
          <td>${p.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Off</span>'}</td>
          <td>${canEdit ? `
            <button class="btn btn-sm btn-outline-primary" onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="removeProduct('${p.id}')"><i class="fas fa-trash"></i></button>
          ` : '-'}</td>
        </tr>`).join("") || "<tr><td colspan='8' class='text-center text-muted py-4'>No products in this category</td></tr>";
    }

    function openProductModal(p) {
      if (!isAdmin()) return;
      document.getElementById("prodId").value = p ? p.id : "";
      document.getElementById("prodModalTitle").textContent = p ? "Edit Product" : "Add Product";
      document.getElementById("pName").value = p ? p.name : "";
      document.getElementById("pSlug").value = p ? p.slug : "";
      document.getElementById("pCategory").value = p ? (p.category || p.badge || "Everyday") : "Everyday";
      document.getElementById("pSize").value = p ? p.size : "100ml";
      document.getElementById("pPrice").value = p ? p.price : "";
      document.getElementById("pMrp").value = p ? (p.mrp || "") : "";
      document.getElementById("pStock").value = p ? p.stock : 0;
      document.getElementById("pSku").value = p ? (p.sku || "") : "";
      document.getElementById("pShort").value = p ? (p.short_desc || "") : "";
      document.getElementById("pDesc").value = p ? (p.description || "") : "";
      document.getElementById("pImg").value = p ? (p.image_url || "") : "";
      const prev = document.getElementById("pImgPreview");
      if (p && p.image_url) { prev.src = p.image_url; prev.style.display = "block"; }
      else { prev.src = ""; prev.style.display = "none"; }
      document.getElementById("pImgFile").value = "";
      document.getElementById("pImgStatus").textContent = "Upload JPG/PNG or paste URL";
      document.getElementById("pActive").checked = p ? p.is_active : true;
      document.getElementById("pFeatured").checked = p ? p.is_featured : false;
      new bootstrap.Modal(document.getElementById("prodModal")).show();
    }
    function editProduct(p) { openProductModal(p); }

    async function saveProduct() {
  const id = document.getElementById("prodId").value;
  const data = {
    name: document.getElementById("pName").value.trim(),
    slug: document.getElementById("pSlug").value.trim(),
    badge: document.getElementById("pCategory").value,
    category: document.getElementById("pCategory").value,
    size: document.getElementById("pSize").value.trim(),   // free text
    price: Number(document.getElementById("pPrice").value),
    mrp: document.getElementById("pMrp").value ? Number(document.getElementById("pMrp").value) : null,
    stock: Number(document.getElementById("pStock").value) || 0,
    sku: document.getElementById("pSku").value.trim() || null,
    short_desc: document.getElementById("pShort").value.trim() || null,
    description: document.getElementById("pDesc").value.trim() || null,
    image_url: document.getElementById("pImg").value.trim() || null,
    is_active: document.getElementById("pActive").checked,
    is_featured: document.getElementById("pFeatured").checked
  };
  if (!data.name || !data.slug || !data.price || !data.size) {
    alert("Name, slug, size and price are required");
    return;
  }
  try {
    if (id) await updateProduct(id, data);
    else await createProduct(data);
    bootstrap.Modal.getInstance(document.getElementById("prodModal")).hide();
    loadProducts();
  } catch (e) { alert("Save failed: " + e.message); }
}

    
    document.getElementById("pImg")?.addEventListener("input", function() {
      const prev = document.getElementById("pImgPreview");
      if (this.value) { prev.src = this.value; prev.style.display = "block"; }
    });
    document.getElementById("pImgFile")?.addEventListener("change", async function() {
      const file = this.files[0];
      if (!file) return;
      const st = document.getElementById("pImgStatus");
      st.textContent = "Uploading...";
      try {
        const { url, source } = await processImageUpload(file, STORAGE_PRODUCT);
        document.getElementById("pImg").value = url;
        const prev = document.getElementById("pImgPreview");
        prev.src = url;
        prev.style.display = "block";
        st.textContent = source === "storage" ? "Uploaded to cloud storage" : "Image compressed & ready (saved with product)";
      } catch (e) {
        st.textContent = e.message;
      }
    });

    async function removeProduct(id) {
      if (!isAdmin() || !confirm("Delete this product from database?")) return;
      try { await deleteProduct(id); loadProducts(); }
      catch (e) { alert(e.message); }
    }
  </script>
</body>
</html>
