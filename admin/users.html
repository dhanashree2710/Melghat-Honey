<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | Melghat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    body { background: #f5f0e8; }
    .table-wrap { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); overflow:hidden; }
  </style>
</head>
<body>
  <div class="row g-0 min-vh-100">
    <div class="col-md-2 admin-sidebar" id="adminSidebar"></div>
    <div class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">Users</h3>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()"><i class="fas fa-sync me-1"></i>Refresh</button>
      </div>
      <div class="table-wrap">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Active</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody id="usrTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    const session = requireStaff();
    if (session) {
      if (session.role !== "admin") {
        alert("Only admin can manage users");
        location.href = "index.html";
      } else {
        renderAdminSidebar("users");
        loadUsers();
      }
    }

    async function loadUsers() {
      const rows = await fetchUsers();
      document.getElementById("usrTable").innerHTML = rows.map(u => `
        <tr>
          <td>${u.full_name}</td>
          <td>${u.email}</td>
          <td>${u.phone || "-"}</td>
          <td>
            <select class="form-select form-select-sm" style="width:120px" onchange="changeRole('${u.id}', this.value)">
              <option value="customer" ${u.role==='customer'?'selected':''}>customer</option>
              <option value="staff" ${u.role==='staff'?'selected':''}>staff</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
            </select>
          </td>
          <td>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" ${u.is_active?'checked':''} onchange="toggleActive('${u.id}', this.checked)">
            </div>
          </td>
          <td><small>${u.created_at ? new Date(u.created_at).toLocaleDateString() : ""}</small></td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deactivateUser('${u.id}')" title="Deactivate"><i class="fas fa-user-slash"></i></button></td>
        </tr>`).join("");
    }

    async function changeRole(id, role) {
      try {
        await sbPatch("users", `id=eq.${id}`, { role, updated_at: new Date().toISOString() });
      } catch (e) { alert(e.message); loadUsers(); }
    }

    async function toggleActive(id, active) {
      try {
        await sbPatch("users", `id=eq.${id}`, { is_active: active, updated_at: new Date().toISOString() });
      } catch (e) { alert(e.message); loadUsers(); }
    }

    async function deactivateUser(id) {
      if (!confirm("Deactivate this user?")) return;
      await toggleActive(id, false);
      loadUsers();
    }
  </script>
</body>
</html>
