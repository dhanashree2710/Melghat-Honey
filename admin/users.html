<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <title>Users | Melghat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    body { background: #f5f0e8; }
    .table-wrap { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); overflow:hidden; }
    .create-card {
      background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05);
      padding:20px; margin-bottom:20px; border:1px solid rgba(244,180,0,0.25);
    }
  </style>
</head>
<body>
  <div class="row g-0 min-vh-100">
    <div class="col-md-2 admin-sidebar" id="adminSidebar"></div>
    <div class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="fw-bold mb-0">Users</h3>
        <div class="d-flex gap-2">
          <button class="btn btn-warning btn-sm fw-semibold" onclick="toggleCreateForm()">
            <i class="fas fa-user-plus me-1"></i>Create User
          </button>
          <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()"><i class="fas fa-sync me-1"></i>Refresh</button>
        </div>
      </div>

      <!-- Create User form -->
      <div class="create-card" id="createUserCard" style="display:none">
        <h5 class="fw-bold mb-3"><i class="fas fa-user-plus me-2 text-warning"></i>Create New User</h5>
        <form id="createUserForm" onsubmit="submitCreateUser(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Full Name *</label>
              <input type="text" class="form-control" id="cuName" required placeholder="Full name">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email *</label>
              <input type="email" class="form-control" id="cuEmail" required placeholder="email@example.com">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Phone</label>
              <input type="tel" class="form-control" id="cuPhone" placeholder="+91 ...">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Password *</label>
              <input type="text" class="form-control" id="cuPassword" required minlength="4" placeholder="Min 4 characters">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Role *</label>
              <select class="form-select" id="cuRole" required>
                <option value="customer">Customer</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-warning fw-semibold" id="cuSubmitBtn">
                <i class="fas fa-check me-1"></i>Create User
              </button>
              <button type="button" class="btn btn-outline-secondary" onclick="toggleCreateForm(false)">Cancel</button>
            </div>
          </div>
        </form>
        <div id="cuMsg" class="mt-2 small" style="display:none"></div>
      </div>

      <div class="table-wrap">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Active</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody id="usrTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    const session = requireStaff();
    if (session) {
      if (session.role !== "admin") {
        alert("Only admin can manage users");
        location.href = "index.html";
      } else {
        renderAdminSidebar("users");
        loadUsers();
      }
    }

    function toggleCreateForm(show) {
      const card = document.getElementById("createUserCard");
      if (typeof show === "boolean") {
        card.style.display = show ? "block" : "none";
      } else {
        card.style.display = card.style.display === "none" ? "block" : "none";
      }
      if (card.style.display === "block") {
        document.getElementById("createUserForm").reset();
        document.getElementById("cuMsg").style.display = "none";
      }
    }

    async function submitCreateUser(e) {
      e.preventDefault();
      const btn = document.getElementById("cuSubmitBtn");
      const msg = document.getElementById("cuMsg");
      btn.disabled = true;
      msg.style.display = "none";
      try {
        await adminCreateUser({
          full_name: document.getElementById("cuName").value,
          email: document.getElementById("cuEmail").value,
          phone: document.getElementById("cuPhone").value,
          password: document.getElementById("cuPassword").value,
          role: document.getElementById("cuRole").value
        });
        msg.className = "mt-2 small text-success";
        msg.textContent = "User created successfully.";
        msg.style.display = "block";
        document.getElementById("createUserForm").reset();
        loadUsers();
        setTimeout(() => toggleCreateForm(false), 1200);
      } catch (err) {
        msg.className = "mt-2 small text-danger";
        msg.textContent = err.message || "Failed to create user.";
        msg.style.display = "block";
      } finally {
        btn.disabled = false;
      }
    }

    async function loadUsers() {
      const rows = await fetchUsers();
      document.getElementById("usrTable").innerHTML = rows.map(u => `
        <tr>
          <td>${u.full_name || ""}</td>
          <td>${u.email || ""}</td>
          <td>${u.phone || "-"}</td>
          <td>
            <select class="form-select form-select-sm" style="width:120px" onchange="changeRole('${u.id}', this.value)">
              <option value="customer" ${u.role==='customer'?'selected':''}>customer</option>
              <option value="staff" ${u.role==='staff'?'selected':''}>staff</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
            </select>
          </td>
          <td>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" ${u.is_active?'checked':''} onchange="toggleActive('${u.id}', this.checked)">
            </div>
          </td>
          <td><small>${u.created_at ? new Date(u.created_at).toLocaleDateString() : ""}</small></td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deactivateUser('${u.id}')" title="Deactivate"><i class="fas fa-user-slash"></i></button></td>
        </tr>`).join("") || `<tr><td colspan="7" class="text-center text-muted py-4">No users yet</td></tr>`;
    }

    async function changeRole(id, role) {
      try {
        await sbPatch("users", `id=eq.${id}`, { role, updated_at: new Date().toISOString() });
      } catch (e) { alert(e.message); loadUsers(); }
    }

    async function toggleActive(id, active) {
      try {
        await sbPatch("users", `id=eq.${id}`, { is_active: active, updated_at: new Date().toISOString() });
      } catch (e) { alert(e.message); loadUsers(); }
    }

    async function deactivateUser(id) {
      if (!confirm("Deactivate this user?")) return;
      await toggleActive(id, false);
      loadUsers();
    }
  </script>
</body>
</html>
