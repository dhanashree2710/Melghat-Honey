<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Melghat Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    body { background: #f5f0e8; }
    .stat-card { background:#fff; border-radius:15px; padding:22px; box-shadow:0 5px 20px rgba(0,0,0,0.06); transition:transform .2s; }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card h3 { color: #f4b400; font-weight:700; margin:0; }
    .table-wrap { background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); overflow:hidden; }
  </style>
</head>
<body>
  <div class="row g-0 min-vh-100">
    <div class="col-md-2 admin-sidebar" id="adminSidebar"></div>
    <div class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Dashboard</h3>
        <span class="badge bg-success" id="roleBadge"></span>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card text-center"><h3 id="statProducts">-</h3><p class="mb-0 text-muted small">Products</p></div></div>
        <div class="col-6 col-md-3"><div class="stat-card text-center"><h3 id="statOrders">-</h3><p class="mb-0 text-muted small">Orders</p></div></div>
        <div class="col-6 col-md-3"><div class="stat-card text-center"><h3 id="statUsers">-</h3><p class="mb-0 text-muted small">Users</p></div></div>
        <div class="col-6 col-md-3"><div class="stat-card text-center"><h3 id="statRevenue">-</h3><p class="mb-0 text-muted small">Revenue</p></div></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="table-wrap p-3">
            <h6 class="fw-bold mb-3">Products by Category</h6>
            <div id="catStats"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="table-wrap">
            <table class="table table-hover mb-0">
              <thead class="table-dark"><tr><th colspan="4">Recent Orders</th></tr>
              <tr><th>#</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
              <tbody id="dashOrders"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a href="products.html" class="btn btn-warning fw-semibold"><i class="fas fa-box me-1"></i>Manage Products</a>
        <a href="orders.html" class="btn btn-outline-dark"><i class="fas fa-shopping-bag me-1"></i>Manage Orders</a>
        <a href="users.html" class="btn btn-outline-dark" id="usersBtn"><i class="fas fa-users me-1"></i>Manage Users</a>
      </div>
    </div>
  </div>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    const session = requireStaff();
    if (session) {
      renderAdminSidebar("dash");
      document.getElementById("roleBadge").textContent = session.role.toUpperCase();
      if (session.role !== "admin") document.getElementById("usersBtn").style.display = "none";
      loadDash();
    }
    async function loadDash() {
      const [prods, ords, usrs] = await Promise.all([fetchProducts(false), fetchOrders(), fetchUsers()]);
      document.getElementById("statProducts").textContent = prods.length;
      document.getElementById("statOrders").textContent = ords.length;
      document.getElementById("statUsers").textContent = usrs.length;
      document.getElementById("statRevenue").textContent = formatPrice(ords.reduce((s,o)=>s+Number(o.total_amount||0),0));
      const cats = {};
      prods.forEach(p => { const c = p.badge || "Everyday"; cats[c] = (cats[c]||0)+1; });
      document.getElementById("catStats").innerHTML = Object.entries(cats).map(([k,v]) =>
        `<div class="d-flex justify-content-between border-bottom py-2"><span>${k}</span><strong>${v}</strong></div>`
      ).join("") || "<p class='text-muted'>No products</p>";
      document.getElementById("dashOrders").innerHTML = ords.slice(0,6).map(o =>
        `<tr><td>${o.order_number}</td><td>${o.customer_name}</td><td>${formatPrice(o.total_amount)}</td><td>${statusBadge(o.order_status)}</td></tr>`
      ).join("") || "<tr><td colspan='4' class='text-center text-muted'>No orders yet</td></tr>";
    }
  </script>
</body>
</html>
