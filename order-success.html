<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed | Melghat Honey</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .success-wrap {
      max-width: 520px; margin: 60px auto; text-align: center;
      background: #fff; border-radius: 24px; padding: 40px 28px;
      box-shadow: 0 12px 40px rgba(78,52,46,0.12);
      border: 1px solid rgba(244,180,0,0.2);
      animation: popIn 0.5s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .success-icon {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg,#e8f5e9,#c8e6c9);
      color: #2e7d32; font-size: 2.5rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .order-num {
      background: #faf6ee; border-radius: 12px; padding: 12px 18px;
      font-weight: 700; color: #3e2723; letter-spacing: 0.5px;
      display: inline-block; margin: 12px 0;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="Melghat" height="42" onerror="this.style.display='none'">
        <span class="ms-1 fw-bold" style="color:#3e2723">Melghat Honey</span>
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="success-wrap">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h2 class="fw-bold" style="color:#2e7d32">Order Placed Successfully!</h2>
      <p class="text-muted mt-2">Thank you for choosing pure Melghat forest honey.</p>
      <div class="order-num" id="orderNumLabel">—</div>
      <p class="small text-muted" id="payNote"></p>
      <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center mt-4">
        <a href="my-orders.html" class="btn btn-warning fw-semibold px-4 rounded-pill">
          <i class="fas fa-truck me-1"></i> Track Order
        </a>
        <a href="products.html" class="btn btn-outline-secondary px-4 rounded-pill">Continue Shopping</a>
      </div>
      <p class="small text-muted mt-4 mb-0">We’ll update status on My Orders. For help: WhatsApp +91 96995 44383</p>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let orderNo = params.get("order") || "";
    let pay = "cod";
    try {
      const last = JSON.parse(sessionStorage.getItem("melghat_last_order") || "{}");
      if (!orderNo && last.order_number) orderNo = last.order_number;
      if (last.payment_method) pay = last.payment_method;
    } catch (e) {}
    document.getElementById("orderNumLabel").textContent = orderNo ? "Order #" + orderNo : "Order received";
    if (pay === "cod") {
      document.getElementById("payNote").textContent = "Payment: Cash on Delivery";
    } else {
      document.getElementById("payNote").textContent = "Payment method: " + pay.toUpperCase() + " · Our team will confirm payment shortly.";
    }
    // Auto redirect to track after 6s
    setTimeout(() => {
      if (document.visibilityState === "visible") {
        // soft hint only — user can click Track
      }
    }, 6000);
  </script>
</body>
</html>
